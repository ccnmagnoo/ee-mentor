descripcion_perfil = "Tiene inicio de actividades en el servicio de SII y patentes al día. Venta de abarrotes, artículos de aseo, líquidos, cigarros, venta de congelados carne, hamburguesas, 4 congeladores, 6 vc cooler. Cuenta con 2 contenedores para almacenamiento. Constantemente a realizado mantenimiento e instalaciones eléctricos, son en términos parciales y aprecia que es de una calidad regular, se mantiene funcional. Tiene dificultades logística de suministro , se menciona perdidas $50 millones por vencimiento en buque. Está gestiones para la instalación de paneles fotovoltaico, 30 paneles , aprox. 15kWp. Tiene instalado led en todo el establecimiento, realiza mantenimiento preventivo de los equipos de frío, coordina con especialista de la Armada para mantenimiento, por confianza y certezas del servicio. Cuenta con dos equipos de aire acondicionado y estos utilizan en distinto grado dependiendo del clima. Hay una formación básica de la buena utilización de los recursos energéticos. En la noche se apagan equipamiento no crítico, mayormente están prendidos. Tiene 2 vitrinas refrigeradas, para helados y para productos cárnicos.\r\nUbicación https://maps.app.goo.gl/NfASY1sig6rwK5uo9"
