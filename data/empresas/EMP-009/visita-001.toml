descripcion_perfil = "Le Frits es una PYME gastronómica de servicio de alimentación rápida ubicada en Rapa Nui , cuya actividad principal corresponde a la preparación y venta de empanadas fritas, frituras, ceviches, bebidas y otros productos de consumo inmediato. Su operación considera procesos de cocción, fritura, conservación de alimentos y atención de público. El consumo energético del establecimiento se concentra principalmente en los procesos de cocción y fritura, mediante equipos eléctricos o a gas destinados a la preparación de empanadas y otros productos fritos. Existe una demanda permanente asociada a la refrigeración y conservación de alimentos, especialmente para materias primas perecibles como pescados, mariscos, bebidas y otros productos que requieren cadena de frío.\r\nSe observa además consumo asociado a iluminación interior y exterior, equipamiento de apoyo de cocina, sistemas de extracción de aire y equipos de atención al cliente. Debido a la naturaleza del negocio, la demanda energética presenta mayor intensidad durante los horarios de preparación y atención al público, especialmente en períodos de alta afluencia turística. Considerando su ubicación en , donde los costos de abastecimiento y operación suelen ser superiores a los del territorio continental, la gestión eficiente de la energía representa una oportunidad relevante para reducir costos operacionales y mejorar la competitividad del negocio."
