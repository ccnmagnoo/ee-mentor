observaciones = "El restaurante Club Sandwich, ubicado en Hanga Roa, se caracteriza por la preparación platos rápidos. Desde una perspectiva técnica, este tipo de establecimiento presenta consumos energéticos asociados principalmente a la conservación de alimentos mediante equipos de refrigeración y congelación, la cocción y calentamiento de preparaciones mediante hornos, planchas, freidoras y microondas, así como el uso de sistemas de ventilación, iluminación, lavado y climatización de espacios. Debido al alto flujo operativo que requiere la preparación diaria de carnes, empanadas, sándwiches y otros alimentos frescos, la demanda energética se concentra especialmente en los equipos de cocina y refrigeración, representando las principales oportunidades para implementar medidas de eficiencia energética orientadas a reducir costos operacionales y optimizar el desempeño del local."
