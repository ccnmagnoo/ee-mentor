[secciones.iluminacion]
puntaje = 3
observaciones = "El establecimiento cuenta con luminarias LED en los espacios interiores, lo que constituye una medida favorable desde el punto de vista de la eficiencia energética. No obstante, se observa un diseño de iluminación asociado principalmente a criterios de uso domiciliario y sin una normalización de niveles lumínicos según la función de cada recinto. En este contexto, se recomienda desarrollar un perfil de requerimientos lumínicos que considere niveles de iluminancia, temperatura de color y distribución de la luz acordes a los distintos espacios de uso, con el fin de mejorar el confort visual de los usuarios, favorecer la percepción de calidad de las instalaciones y optimizar el desempeño energético, evitando tanto la sobreiluminación como el subdimensionamiento de los sistemas de iluminación."
tecnologia = "led"
estado = "bueno"
horas_uso_diarias = 6

