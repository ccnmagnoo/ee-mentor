[secciones.envolvente]
puntaje = 2
observaciones = "Las cabañas presentan una envolvente térmica liviana compuesta principalmente por paneles de OSB y cubierta de zincalum, configuración constructiva que ofrece una respuesta adecuada para climas cálidos siempre que se complemente con estrategias pasivas de control térmico. Sin embargo, debido a la alta transmitancia térmica de la cubierta metálica y la baja inercia térmica del sistema constructivo, se hace especialmente relevante fortalecer la ventilación natural cruzada y activa mediante la adecuada disposición de vanos, ventanas y aperturas superiores, favoreciendo la extracción del aire caliente acumulado y mejorando las condiciones de confort interior sin incrementar el consumo energético asociado a sistemas mecánicos de climatización."
ventanas = "regular"
puertas = "regular"
infiltraciones = "regular"
aislacion = "regular"

[secciones.gestion]
puntaje = 2
observaciones = "Desde una perspectiva técnica, la pérdida de prioridad de la sustentabilidad no implica necesariamente una pérdida irreversible de competitividad. Sin embargo, el negocio está desaprovechando una ventaja estratégica previamente construida mediante la obtención del Sello S. La recomendación principal es reintegrar la sustentabilidad como herramienta de gestión y diferenciación comercial, no como un requisito de certificación, generando beneficios simultáneos en eficiencia energética, reducción de costos operacionales y posicionamiento turístico."
nivel = "basica"
monitoreo = true
responsable = "Propietaria"

