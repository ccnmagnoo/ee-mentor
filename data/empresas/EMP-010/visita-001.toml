equipos = []
acuerdos = [ "Se acuerda promover el desarrollo de una política de gestión energética integrada al modelo de negocio del establecimiento, orientada a mejorar progresivamente el desempeño energético de las instalaciones y fortalecer la sustentabilidad de la operación. Dicha política deberá implementarse de manera gradual, considerando la realidad operativa, capacidades de inversión y necesidades específicas del emprendimiento, incorporando acciones tales como el monitoreo de consumos, definición de metas de reducción, mantención eficiente de equipos, mejora de la envolvente térmica, optimización de la iluminación y sensibilización de trabajadores y huéspedes. Asimismo, se establece el compromiso de revisar periódicamente los avances alcanzados, priorizando medidas de bajo costo y alto impacto que contribuyan al confort de los usuarios y a la reducción de los costos operacionales asociados al consumo de energía." ]
proxima_visita = "2026-11-30"
observaciones = "El establecimiento se encuentra próximo a incorporar un sistema de generación fotovoltaica compuesto por 18 paneles solares, con una potencia nominal estimada entre 10 y 12 kWp, cuya instalación está programada para finales de noviembre por la empresa Solari Energía. Esta iniciativa representa un avance significativo en la incorporación de energías renovables y en la reducción de los costos operacionales asociados al consumo eléctrico. En este contexto, se acuerda realizar un dimensionamiento y evaluación del desempeño energético del sistema, con el objetivo de estimar su aporte a la demanda eléctrica del establecimiento, determinar porcentajes de autoconsumo, identificar oportunidades de optimización y establecer indicadores de seguimiento que permitan evaluar los beneficios económicos y energéticos de la inversión una vez que el sistema entre en operación."
