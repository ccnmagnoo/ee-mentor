[secciones.iluminacion]
puntaje = 3
observaciones = "Cuenta con 30 puntos de iluminación en el local, estos son en su mayoría para iluminación de espacios para el servicio de restaurant. Existen oportunidades de mejoramiento ya que no hay una normalización de los grados de iluminación en función del tipo y uso de los espacios, por lo que podría haber algunas optimizaciones de lugares críticos, como espacios de cocina y almacenamiento."
tecnologia = "led"
estado = "bueno"
horas_uso_diarias = 12

[secciones.refrigeracion]
puntaje = 3
observaciones = "Cuenta con 3 visi cooler y un refrigerador, para almacenamiento de bebestibles, cocktelería y otros productos. Los equipos tiene menos de 2 años de antiguedad y cuenta con permanente chequeo por personal técnico especializado de la isla. Esto mantiene la operación a punto como equipos fundamentales para el desempeño del negocio. Otro aspecto que podría ser mejorable es la gestión del funcionamiento de los equipos considerando carga operativa por temporada y clima, por lo que hay posibles mejoras en la gestión eficiente de equipos de refrigeración."
cantidad_equipos = 4
antiguedad_anios = 2
mantencion = "ocasional"

[secciones.congelacion]
puntaje = 3
observaciones = "Cuenta con 4 congeladores, equipos de eficiencia A y con menos de 2 años de operación. Cuentan con cuidados de limpieza y mantenimiento recurrente, realizado por profesionales especializados. Sin embargo no existe un seguimiento claro y trazable del mantenimiento y operación de cada uno por lo que se recomienda establecer lineamientos de gestión energética apropiada para el buen uso del equipamiento."
cantidad_equipos = 4
antiguedad_anios = 2
estado = "bueno"

