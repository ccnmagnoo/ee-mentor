[secciones.gestion]
puntaje = 2
observaciones = "El negocio presenta una gestión energética básica, basada principalmente en el control reactivo de los consumos y costos asociados a la operación, sin contar con procedimientos formales, indicadores de desempeño energético ni herramientas que permitan un seguimiento sistemático de los principales usos de energía. La información disponible sobre los consumos es limitada y se obtiene a partir de la facturación general del suministro, lo que dificulta identificar oportunidades de ahorro, detectar desviaciones operacionales y evaluar el impacto de medidas de eficiencia energética."
nivel = "basica"
monitoreo = false
responsable = "Mauricio"

[secciones.tarifas]
puntaje = 2
observaciones = "La empresa comparte medidor con otros establecimientos turísticos, como el hotel y tiendas de recuerdos. Para una apropiada gestión de la energía se requiere que haya una mejora en el seguimiento de los consumos, en una primera instancia mediante re marcadores, o derechamente individualización de medidores a cada negocio. Sin embargo se detecta que hay una buena coordinación entre el propietario del inmueble/medidor y el dueño del local."
tarifa_actual = "Tarifa Domiciliaria"

