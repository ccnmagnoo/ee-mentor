[secciones.gestion]
puntaje = 2
observaciones = "El negocio de venta de abarrotes cuenta con nociones básicas de gestión energética, enfocadas principalmente en el control operativo de sus equipos de refrigeración y conservación de alimentos. Como parte de sus prácticas habituales, realiza un monitoreo manual de las temperaturas de cámaras, vitrinas y refrigeradores, lo que contribuye a mantener la calidad de los productos y detectar eventuales desviaciones en el funcionamiento de los equipos. Además, existe un interés creciente por reducir los gastos energéticos, motivado por los elevados costos de la electricidad propios de un territorio insular, donde el valor del kWh suele ser significativamente superior al del continente. En este contexto, la implementación de medidas de eficiencia energética, como la optimización de horarios de operación, el mantenimiento preventivo de los sistemas de refrigeración y el fortalecimiento del seguimiento de consumos, representa una oportunidad para mejorar la competitividad y sostenibilidad del negocio."
nivel = "basica"
monitoreo = true
responsable = "Propietaria"

