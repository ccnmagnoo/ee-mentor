[secciones.climatizacion]
puntaje = 1
observaciones = "El establecimiento cuenta con dos equipos de aire acondicionado: uno destinado al área de atención de clientes y otro utilizado para la conservación de alimentos. Ambos equipos operan en espacios que presentan altas infiltraciones de aire debido a las características constructivas del inmueble, lo que reduce significativamente su desempeño y genera un uso poco eficiente de la energía. En estas condiciones, los equipos deben trabajar durante más tiempo para mantener la temperatura requerida, incrementando el consumo eléctrico y el desgaste de los sistemas.\r\n\r\nAdicionalmente, el segundo equipo está siendo utilizado con fines de conservación de alimentos, una función para la cual los equipos de aire acondicionado convencionales no están diseñados. Esta aplicación puede traducirse en bajos niveles de eficiencia energética, dificultades para mantener temperaturas estables y posibles riesgos para la adecuada conservación de los productos.\r\n\r\nEn este contexto, se recomienda implementar medidas para reducir las infiltraciones de aire mediante mejoras en la envolvente del recinto, tales como sellado de puertas, ventanas y otras aberturas. Asimismo, se aconseja evaluar alternativas de refrigeración específicamente diseñadas para la conservación de alimentos, como cámaras de frío o equipos de refrigeración comercial adecuados a los requerimientos de almacenamiento. Estas soluciones permitirían mejorar el control térmico, reducir el consumo energético y asegurar condiciones más apropiadas para la conservación de los productos."
tecnologia = "Split"
mantenciones = "ocasional"
control_temperatura = "manual"

