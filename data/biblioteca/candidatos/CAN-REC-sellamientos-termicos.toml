titulo = "Sellamientos térmicos"
descripcion = "Es fundamental implementar medidas complementarias como la mejora del aislamiento térmico del local (sellos en puertas y ventanas) , la definición de temperaturas de consigna adecuadas (por ejemplo, 20–22 °C en invierno) y el control del encendido/apagado según ocupación real . En caso de mantener calefactores de apoyo, estos deben utilizarse de forma puntual y controlada. Esta estrategia permite reducir el consumo energético, mejorar el confort térmico y optimizar la operación del sistema de climatización , avanzando hacia una gestión más eficiente y sostenible."
