descripcion = "Cuenta con 3 congeladores verticales, los cuales operan de forma continua durante todo el año, constituyendo una carga base permanente. Su aporte al consumo energético es relevante debido a las bajas temperaturas requeridas para la conservación de productos entre -20 o -18°C. Algunos riesgos detectados son la acumulación de escarcha en evaporadores. Aperturas frecuentes de puertas. Eventual degradación de los equipos con un deterioro de sellos de aislamiento, además de la sobrecarga de productos que dificulta la circulación del aire frío. Otro riesgo es la potencial ubicación cercana a fuentes de calor o lugares con escaza ventilación."
