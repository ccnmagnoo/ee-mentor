descripcion = "El cliente considera la opción de fraccionar el equipamiento de cocción a leña, donde la cocción en alto volumen se concentre en un segundo horno con mejor ubicación. En dicho escenario se aconseja implementar una programación operativa del uso del horno, concentrando la producción en horarios definidos y evitando funcionamiento innecesario fuera de periodos de alta demanda. Esta medida permite reducir el calor residual acumulado en el ambiente, mejorar la eficiencia energética global del proceso y optimizar el uso del recurso térmico."
