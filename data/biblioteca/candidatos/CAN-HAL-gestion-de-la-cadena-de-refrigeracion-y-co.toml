titulo = "Gestión de la cadena de refrigeración y congelados"
descripcion = "La empresa presenta una gestión operativa de los sistemas de refrigeración basada en conocimientos en base a la experiencia del personal y los dueños. Pero este no cuenta con respaldo documental ni control formal de parámetros críticos. La ausencia de una sistematización de indicadores de setpoints (temperaturas, ciclos, tiempos de descongelamiento) impide verificar si los equipos están operando en condiciones óptimas o sobredimensionadas. Además, aunque existe un uso diferenciado según la etapa de manufactura, este no podría estar estandarizado durante la operación anual, lo que puede generar inconsistencias térmicas, sobreconsumo energético y potenciales riesgos. Hay dependencia de la experiencia operativa más que de una gestión técnica sistemática."
