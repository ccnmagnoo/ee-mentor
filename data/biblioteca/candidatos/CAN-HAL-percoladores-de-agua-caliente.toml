descripcion = "Los percoladores son equipos que mantienen agua caliente por períodos prolongados. Aunque su potencia individual es menor que la de los hornos, pueden generar consumos importantes cuando permanecen energizados fuera de los horarios de demanda efectiva. Riesgo de exceso de consumo pueden darse en operación continua durante toda la jornada. Mantenimiento de temperatura durante periodos sin ventas y pérdidas térmicas por falta de aislamiento o deterioro del equipo."
