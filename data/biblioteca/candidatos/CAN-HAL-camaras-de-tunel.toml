descripcion = "Se utiliza las cámaras de túneles para almacenamiento en -20ºC por falta de espacios. Se observa una práctica inadecuada en el uso de los túneles de enfriamiento, los cuales están siendo utilizados como cámaras de refrigeración para almacenamiento de productos terminados, pese a que estos equipos están diseñados específicamente para procesos de choque térmico y no para almacenamiento continuo. Esta situación puede afectar la eficiencia energética del sistema, generar un uso de específico para este tipo equipos, acortar su vida útil."
