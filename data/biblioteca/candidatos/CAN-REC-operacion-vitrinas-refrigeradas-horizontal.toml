descripcion = "De forma similar a los equipos congeladores, se recomienda mantener y planificar una limpieza periódica de serpentines y condensadores de los equipos .Verificar temperaturas de consigna adecuadas para cada producto .Revisar sellos y mecanismos de cierre . E implementar termómetros visibles o termómetros manuales, para seguimiento operativo del punto de funcionamiento de los mismos. Evitar la exposición directa a radiación solar o fuentes de calor y contar con coberturas del tipo reflectante (similar a las viseras de estacionamiento los vehículos) para reducción de perdidas durante la noche."
