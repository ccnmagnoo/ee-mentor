id = "CAN-REC-incorporar-indicadores-energeticos-en-prop"
tipo = "recomendacion"
titulo = "Incorporar indicadores energéticos en propuesta de valor comercial"
descripcion = "Se recomienda complementar el valor de la propuesta comercial de Ecosuper con los indicadores obtenidos de un sistema básico de gestión de la energía que incluya la definición de indicadores clave de desempeño (KPIs), tales como consumo energético por unidad de venta, intensidad energética y costos energéticos mensuales. Asimismo, es clave establecer un monitoreo periódico de los consumos, asignar responsables internos y capacitar al personal en buenas prácticas energéticas, y de manera que puedan ser comunicados a clientes como parte de la propuesta de valor del negocio. Este proceso permitirá profesionalizar la gestión energética, mejorar la eficiencia operativa y fortalecer el posicionamiento sostenible de Ecosuper."
