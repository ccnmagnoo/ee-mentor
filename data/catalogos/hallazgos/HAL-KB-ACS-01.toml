codigo = "KB-ACS-01"
titulo = "ACS Eléctrica con termoaculuradores"
categoria = "acs"
descripcion = "La producción de Agua Caliente Sanitaria (ACS) se realiza mediante dos termos eléctricos de 500 L y 250 L , destinados principalmente al uso en habitaciones, lavandería y servicios. El hotel también dispone de servicio de lavandería , equipado con 4 lavadoras y 3 secadoras eléctricas , complementado con secado natural en una sala con techo de policarbonato, lo que permite reducir parcialmente el consumo energético asociado al secado mecánico."
